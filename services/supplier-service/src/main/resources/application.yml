# 作用：supplier 服务的本地开发配置。
# 数据源指向 Docker Compose PostgreSQL，使用 flowmesh_supplier 业务账号。

spring:
  application:
    name: supplier-service

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  servlet:
    multipart:
      max-file-size: ${FLOWMESH_DOCUMENT_MAX_FILE_SIZE:20MB}
      max-request-size: ${FLOWMESH_DOCUMENT_MAX_REQUEST_SIZE:21MB}

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: "jdbc:postgresql://localhost:5432/flowmesh?currentSchema=supplier&sslmode=${DB_SSLMODE:disable}"
    username: ${SUPPLIER_DB_USER:flowmesh_supplier}
    password: ${SUPPLIER_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  flyway:
    fail-on-missing-locations: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.flowmesh.common.persistence
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8082
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 21MB
    max-swallow-size: 22MB

logging:
  pattern:
    level: "traceId=%X{traceId} %5p"

flowmesh:
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  outbox:
    enabled: ${FLOWMESH_OUTBOX_ENABLED:false}
    publish-interval-ms: ${FLOWMESH_OUTBOX_PUBLISH_INTERVAL_MS:1000}
    batch-size: ${FLOWMESH_OUTBOX_BATCH_SIZE:10}
    lease-seconds: ${FLOWMESH_OUTBOX_LEASE_SECONDS:60}
    send-timeout-ms: ${FLOWMESH_OUTBOX_SEND_TIMEOUT_MS:3000}
    max-attempts: ${FLOWMESH_OUTBOX_MAX_ATTEMPTS:5}
    retry-base-delay-seconds: ${FLOWMESH_OUTBOX_RETRY_BASE_DELAY_SECONDS:1}
  supplier:
    consumer:
      enabled: ${FLOWMESH_SUPPLIER_CONSUMER_ENABLED:false}
  workflow:
    base-url: ${FLOWMESH_WORKFLOW_BASE_URL:http://localhost:8083}
    client:
      connect-timeout: ${FLOWMESH_WORKFLOW_CONNECT_TIMEOUT:2s}
      read-timeout: ${FLOWMESH_WORKFLOW_READ_TIMEOUT:3s}
  object-storage:
    endpoint: ${FLOWMESH_OBJECT_STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${FLOWMESH_OBJECT_STORAGE_ACCESS_KEY:flowmesh}
    secret-key: ${FLOWMESH_OBJECT_STORAGE_SECRET_KEY:change-me-minio}
    bucket: ${FLOWMESH_OBJECT_STORAGE_BUCKET:flowmesh-documents}
    presigned-url-expiry-seconds: ${FLOWMESH_OBJECT_STORAGE_PRESIGNED_URL_EXPIRY_SECONDS:300}
    max-file-size-bytes: ${FLOWMESH_DOCUMENT_MAX_FILE_SIZE_BYTES:20971520}
    readiness-enabled: ${FLOWMESH_OBJECT_STORAGE_READINESS_ENABLED:false}
  file-scan:
    enabled: ${FLOWMESH_FILE_SCAN_ENABLED:false}
    host: ${FLOWMESH_CLAMAV_HOST:localhost}
    port: ${FLOWMESH_CLAMAV_PORT:3310}
    timeout: ${FLOWMESH_CLAMAV_TIMEOUT:10s}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  access-channel: ${ROCKETMQ_ACCESS_CHANNEL:LOCAL}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:flowmesh-supplier-producer}
    access-key: ${ROCKETMQ_PRODUCER_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_PRODUCER_SECRET_KEY:}
    tls-enable: ${ROCKETMQ_PRODUCER_TLS_ENABLED:false}
  consumer:
    access-key: ${ROCKETMQ_CONSUMER_ACCESS_KEY:}
    secret-key: ${ROCKETMQ_CONSUMER_SECRET_KEY:}
    tls-enable: ${ROCKETMQ_CONSUMER_TLS_ENABLED:false}

management:
  tracing:
    enabled: ${FLOWMESH_TRACING_ENABLED:false}
    sampling:
      probability: ${FLOWMESH_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${FLOWMESH_OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      connect-timeout: ${FLOWMESH_OTEL_CONNECT_TIMEOUT:2s}
      timeout: ${FLOWMESH_OTEL_EXPORT_TIMEOUT:5s}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db,rocketMq,objectStorage,clamAv
