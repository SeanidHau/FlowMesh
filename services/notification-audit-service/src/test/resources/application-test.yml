flowmesh:
  audit:
    consumer-enabled: false
  security:
    jwt:
      issuer: flowmesh-test
      signing-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

spring:
