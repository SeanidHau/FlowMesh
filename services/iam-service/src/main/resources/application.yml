# 作用：IAM 服务的本地开发配置。
# 数据源指向 Docker Compose PostgreSQL，使用 flowmesh_iam 业务账号。

spring:
  application:
    name: iam-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: jdbc:postgresql://localhost:5432/flowmesh?currentSchema=iam
    username: ${IAM_DB_USER:flowmesh_iam}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}

  flyway:
    # 作用：Flyway 使用 flowmesh_iam 账号在 iam schema 上执行迁移。
    fail-on-missing-locations: false

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.flowmesh.common.persistence
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

logging:
  pattern:
    level: "traceId=%X{traceId} %5p"

flowmesh:
  demo-data:
    enabled: ${FLOWMESH_DEMO_DATA_ENABLED:false}
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    login-rate-limit:
      enabled: ${FLOWMESH_LOGIN_RATE_LIMIT_ENABLED:false}
      account-max-attempts: ${FLOWMESH_LOGIN_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:5}
      client-max-attempts: ${FLOWMESH_LOGIN_RATE_LIMIT_CLIENT_MAX_ATTEMPTS:30}
      window: ${FLOWMESH_LOGIN_RATE_LIMIT_WINDOW:PT1M}

management:
  health:
    redis:
      enabled: ${FLOWMESH_LOGIN_RATE_LIMIT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
