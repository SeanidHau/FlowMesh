# 作用：IAM 服务的本地开发配置。
# 数据源指向 Docker Compose PostgreSQL，使用 flowmesh_iam 业务账号。

spring:
  application:
    name: iam-service

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: "jdbc:postgresql://localhost:5432/flowmesh?currentSchema=iam&sslmode=${DB_SSLMODE:disable}"
    username: ${IAM_DB_USER:flowmesh_iam}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT_MS:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME_MS:1800000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  flyway:
    # 作用：Flyway 使用独立迁移账号执行 DDL，运行时数据源账号不持有 Schema 所有权。
    user: ${IAM_DB_MIGRATOR_USER:flowmesh_iam_migrator}
    password: ${IAM_DB_MIGRATOR_PASSWORD}
    schemas: iam
    create-schemas: true
    fail-on-missing-locations: true
    # 作用：生产启动必须校验迁移完整性，禁止清库和乱序执行，避免破坏已发布 schema。
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
    baseline-on-migrate: false

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  type-handlers-package: com.flowmesh.common.persistence
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081
  shutdown: graceful
  tomcat:
    connection-timeout: 5s
    max-http-form-post-size: 1MB
    max-swallow-size: 2MB

logging:
  pattern:
    level: "traceId=%X{traceId} %5p"

flowmesh:
  demo-data:
    enabled: ${FLOWMESH_DEMO_DATA_ENABLED:false}
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
    refresh-token-cleanup:
      enabled: ${FLOWMESH_REFRESH_TOKEN_CLEANUP_ENABLED:true}
      interval-ms: ${FLOWMESH_REFRESH_TOKEN_CLEANUP_INTERVAL_MS:3600000}
      initial-delay-ms: ${FLOWMESH_REFRESH_TOKEN_CLEANUP_INITIAL_DELAY_MS:60000}
      retention: ${FLOWMESH_REFRESH_TOKEN_CLEANUP_RETENTION:P30D}
      batch-size: ${FLOWMESH_REFRESH_TOKEN_CLEANUP_BATCH_SIZE:1000}
    login-rate-limit:
      enabled: ${FLOWMESH_LOGIN_RATE_LIMIT_ENABLED:false}
      account-max-attempts: ${FLOWMESH_LOGIN_RATE_LIMIT_ACCOUNT_MAX_ATTEMPTS:5}
      client-max-attempts: ${FLOWMESH_LOGIN_RATE_LIMIT_CLIENT_MAX_ATTEMPTS:30}
      window: ${FLOWMESH_LOGIN_RATE_LIMIT_WINDOW:PT1M}
      fail-open: ${FLOWMESH_LOGIN_RATE_LIMIT_FAIL_OPEN:true}

management:
  tracing:
    enabled: ${FLOWMESH_TRACING_ENABLED:false}
    sampling:
      probability: ${FLOWMESH_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${FLOWMESH_OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      connect-timeout: ${FLOWMESH_OTEL_CONNECT_TIMEOUT:2s}
      timeout: ${FLOWMESH_OTEL_EXPORT_TIMEOUT:5s}
  health:
    redis:
      enabled: ${FLOWMESH_LOGIN_RATE_LIMIT_ENABLED:false}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
