# 作用：IAM 服务的本地开发配置。
# 数据源指向 Docker Compose PostgreSQL，使用 flowmesh_iam 业务账号。

spring:
  application:
    name: iam-service

  datasource:
    url: jdbc:postgresql://localhost:5432/flowmesh?currentSchema=iam
    username: ${IAM_DB_USER:flowmesh_iam}
    password: ${IAM_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    # 作用：Flyway 使用 flowmesh_iam 账号在 iam schema 上执行迁移。
    fail-on-missing-locations: false

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8081

flowmesh:
  demo-data:
    enabled: ${FLOWMESH_DEMO_DATA_ENABLED:false}
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
