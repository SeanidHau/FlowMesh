# 作用：IAM 服务的本地开发配置。
# 当前使用内存 H2；接入 Docker Compose PostgreSQL 后再替换为对应 Profile。

spring:
  application:
    name: iam-service

  datasource:
    url: jdbc:h2:mem:flowmesh_iam;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # 作用：当前阶段不让 Hibernate 自动创建表。
      # 后续所有表结构由 Flyway Migration 管理。
      ddl-auto: validate
    open-in-view: false

  flyway:
    # 作用：允许服务骨架在尚未创建 Migration 文件时启动。
    # 新增首个 V1 Migration 后，Flyway 会自动执行它。
    fail-on-missing-locations: false

server:
  port: 8081

flowmesh:
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY:}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
