# 作用：workflow 服务的本地开发配置。

spring:
  application:
    name: workflow-service

  datasource:
    url: jdbc:postgresql://localhost:5432/flowmesh?currentSchema=workflow
    username: ${WORKFLOW_DB_USER:flowmesh_workflow}
    password: ${WORKFLOW_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    schemas: workflow
    create-schemas: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8083

flowmesh:
  security:
    jwt:
      issuer: ${JWT_ISSUER:flowmesh-local}
      signing-key: ${JWT_SIGNING_KEY}
      access-token-ttl: PT15M
      refresh-token-ttl: P7D
  workflow:
    consumer:
      enabled: ${FLOWMESH_WORKFLOW_CONSUMER_ENABLED:false}
    outbox:
      enabled: ${FLOWMESH_WORKFLOW_OUTBOX_ENABLED:false}
      publish-interval-ms: ${FLOWMESH_WORKFLOW_OUTBOX_PUBLISH_INTERVAL_MS:1000}
      max-attempts: ${FLOWMESH_WORKFLOW_OUTBOX_MAX_ATTEMPTS:5}
      retry-base-delay-seconds: ${FLOWMESH_WORKFLOW_OUTBOX_RETRY_BASE_DELAY_SECONDS:1}

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV_ADDR:localhost:9876}
  producer:
    group: ${ROCKETMQ_PRODUCER_GROUP:flowmesh-workflow-producer}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
