# 作用：Gateway 服务的本地开发配置。

spring:
  application:
    name: gateway-service

  lifecycle:
    timeout-per-shutdown-phase: 20s

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2s}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT_MS:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
          routes:
            - id: iam-service
              uri: ${FLOWMESH_IAM_URL:http://localhost:8081}
              predicates:
                - Path=/api/iam/**
              filters:
                # 作用：在入口拒绝超出认证接口边界的请求体，避免大请求占用 Gateway 内存和连接。
                - name: RequestSize
                  args:
                    maxSize: ${FLOWMESH_GATEWAY_AUTH_MAX_REQUEST_SIZE:1MB}
                - StripPrefix=2
            - id: supplier-service
              uri: ${FLOWMESH_SUPPLIER_URL:http://localhost:8082}
              predicates:
                - Path=/api/supplier/**
              filters:
                # 作用：允许材料上传的最大 multipart 请求体，但仍在 Gateway 处先于下游拒绝异常大请求。
                - name: RequestSize
                  args:
                    maxSize: ${FLOWMESH_GATEWAY_SUPPLIER_MAX_REQUEST_SIZE:21MB}
                - StripPrefix=2
            - id: workflow-service
              uri: ${FLOWMESH_WORKFLOW_URL:http://localhost:8083}
              predicates:
                - Path=/api/workflow/**
              filters:
                # 作用：流程命令和查询均为小请求，限制请求体可降低入口资源消耗风险。
                - name: RequestSize
                  args:
                    maxSize: ${FLOWMESH_GATEWAY_WORKFLOW_MAX_REQUEST_SIZE:1MB}
                - StripPrefix=2
            - id: notification-audit-service
              uri: ${FLOWMESH_NOTIFICATION_AUDIT_URL:http://localhost:8085}
              predicates:
                - Path=/api/notification/**
              filters:
                # 作用：通知查询和已读操作不需要大请求体，统一在 Gateway 限制其大小。
                - name: RequestSize
                  args:
                    maxSize: ${FLOWMESH_GATEWAY_NOTIFICATION_MAX_REQUEST_SIZE:1MB}
                - StripPrefix=2

server:
  port: 8080
  shutdown: graceful

management:
  tracing:
    enabled: ${FLOWMESH_TRACING_ENABLED:false}
    sampling:
      probability: ${FLOWMESH_TRACING_SAMPLING_PROBABILITY:0.1}
  otlp:
    tracing:
      export:
        enabled: ${FLOWMESH_OTEL_EXPORT_ENABLED:false}
      endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
      connect-timeout: ${FLOWMESH_OTEL_CONNECT_TIMEOUT:2s}
      timeout: ${FLOWMESH_OTEL_EXPORT_TIMEOUT:5s}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

logging:
  pattern:
    level: "traceId=%X{traceId} %5p"

flowmesh:
  gateway:
    rate-limit:
      # 该请求头必须由可信 Ingress 覆写，不能由公网客户端直接决定。
      client-ip-header: ${FLOWMESH_GATEWAY_CLIENT_IP_HEADER:X-Real-IP}
      replenish-rate: ${FLOWMESH_GATEWAY_RATE_LIMIT_REPLENISH_RATE:100}
      burst-capacity: ${FLOWMESH_GATEWAY_RATE_LIMIT_BURST_CAPACITY:200}
      requested-tokens: ${FLOWMESH_GATEWAY_RATE_LIMIT_REQUESTED_TOKENS:1}
