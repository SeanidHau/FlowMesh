name: Production acceptance

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: '待验收的 40 位提交 SHA 镜像标签'
        required: true
        type: string
      evidence_dir:
        description: '目标运维环境中已归档的生产证据目录'
        required: true
        type: string
      evidence_environment:
        description: '证据包对应的目标环境标识，必须与每份报告一致'
        required: true
        type: string
      namespace:
        description: 'FlowMesh Kubernetes 命名空间'
        required: true
        default: flowmesh
        type: string
      release:
        description: 'FlowMesh Helm Release 名称'
        required: true
        default: flowmesh
        type: string
      expect_prometheus_rule:
        description: '目标集群是否使用 Prometheus Operator ServiceMonitor/PrometheusRule'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

jobs:
  acceptance:
    name: Read-only production acceptance
    runs-on: [self-hosted, linux, flowmesh-production]
    environment: production
    timeout-minutes: 30
    steps:
      # 只读取仓库脚本；生产工作流不执行部署、迁移或故障切换。
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require main branch
        run: |
          set -Eeuo pipefail
          [[ "${GITHUB_REF}" == 'refs/heads/main' ]] || {
            echo '生产验收只能从 main 分支执行。' >&2
            exit 1
          }

      - name: Check runner prerequisites
        run: |
          set -Eeuo pipefail
          for command_name in bash curl kubectl openssl psql pg_isready redis-cli ruby cosign; do
            command -v "${command_name}" >/dev/null || {
              echo "生产验收 Runner 缺少命令：${command_name}" >&2
              exit 127
            }
          done

      - name: Run read-only production acceptance
        env:
          FLOWMESH_ACCEPTANCE_REPORT: ${{ runner.temp }}/flowmesh-production-acceptance.md
          FLOWMESH_IMAGE_TAG: ${{ inputs.image_tag }}
          FLOWMESH_EVIDENCE_DIR: ${{ inputs.evidence_dir }}
          FLOWMESH_EVIDENCE_ENVIRONMENT: ${{ inputs.evidence_environment }}
          FLOWMESH_K8S_NAMESPACE: ${{ inputs.namespace }}
          FLOWMESH_HELM_RELEASE: ${{ inputs.release }}
          FLOWMESH_EXPECT_PROMETHEUS_RULE: ${{ inputs.expect_prometheus_rule }}
          # 生产验收不得依赖脚本默认值，三类关键门禁必须显式保持开启。
          FLOWMESH_REQUIRE_RUNTIME_OBSERVABILITY: 'true'
          FLOWMESH_REQUIRE_DEPENDENCY_HA: 'true'
          FLOWMESH_REQUIRE_PRODUCTION_EVIDENCE: 'true'
          FLOWMESH_PG_HOST: ${{ vars.FLOWMESH_PG_HOST }}
          FLOWMESH_PG_PORT: ${{ vars.FLOWMESH_PG_PORT }}
          FLOWMESH_PG_DATABASE: ${{ vars.FLOWMESH_PG_DATABASE }}
          FLOWMESH_PG_USER: ${{ vars.FLOWMESH_PG_USER }}
          FLOWMESH_PG_SSLMODE: ${{ vars.FLOWMESH_PG_SSLMODE }}
          FLOWMESH_PG_SSLROOTCERT: ${{ vars.FLOWMESH_PG_SSLROOTCERT }}
          FLOWMESH_POSTGRES_CA_SECRET_NAME: ${{ vars.FLOWMESH_POSTGRES_CA_SECRET_NAME }}
          FLOWMESH_PG_PASSWORD: ${{ secrets.FLOWMESH_PG_PASSWORD }}
          FLOWMESH_BACKUP_DB_USER: ${{ vars.FLOWMESH_BACKUP_DB_USER }}
          FLOWMESH_BACKUP_DB_PASSWORD: ${{ secrets.FLOWMESH_BACKUP_DB_PASSWORD }}
          FLOWMESH_RETENTION_DB_USER: ${{ vars.FLOWMESH_RETENTION_DB_USER }}
          FLOWMESH_RETENTION_DB_PASSWORD: ${{ secrets.FLOWMESH_RETENTION_DB_PASSWORD }}
          FLOWMESH_REDIS_HOST: ${{ vars.FLOWMESH_REDIS_HOST }}
          FLOWMESH_REDIS_PORT: ${{ vars.FLOWMESH_REDIS_PORT }}
          FLOWMESH_REDIS_USER: ${{ vars.FLOWMESH_REDIS_USER }}
          FLOWMESH_REDIS_PASSWORD: ${{ secrets.FLOWMESH_REDIS_PASSWORD }}
          FLOWMESH_REDIS_TLS: 'true'
          FLOWMESH_ROCKETMQ_NAMESRV_ADDR: ${{ vars.FLOWMESH_ROCKETMQ_NAMESRV_ADDR }}
          FLOWMESH_ROCKETMQ_TLS: 'true'
          FLOWMESH_ROCKETMQ_CA_FILE: ${{ vars.FLOWMESH_ROCKETMQ_CA_FILE }}
          FLOWMESH_OBJECT_STORAGE_ENDPOINT: ${{ vars.FLOWMESH_OBJECT_STORAGE_ENDPOINT }}
          FLOWMESH_HA_EXPECTED_PG_REPLICAS: ${{ vars.FLOWMESH_HA_EXPECTED_PG_REPLICAS }}
          FLOWMESH_HA_REDIS_HOSTS: ${{ vars.FLOWMESH_HA_REDIS_HOSTS }}
          FLOWMESH_HA_EXPECTED_REDIS_REPLICAS: ${{ vars.FLOWMESH_HA_EXPECTED_REDIS_REPLICAS }}
          FLOWMESH_PROMETHEUS_URL: ${{ vars.FLOWMESH_PROMETHEUS_URL }}
          FLOWMESH_ALERTMANAGER_URL: ${{ vars.FLOWMESH_ALERTMANAGER_URL }}
          FLOWMESH_INGRESS_NAMESPACE: ${{ vars.FLOWMESH_INGRESS_NAMESPACE }}
          FLOWMESH_RUNTIME_SECRET_NAME: ${{ vars.FLOWMESH_RUNTIME_SECRET_NAME }}
          FLOWMESH_BACKUP_SECRET_NAME: ${{ vars.FLOWMESH_BACKUP_SECRET_NAME }}
          FLOWMESH_BACKUP_POSTGRES_USER: ${{ vars.FLOWMESH_BACKUP_POSTGRES_USER }}
          FLOWMESH_RETENTION_SECRET_NAME: ${{ vars.FLOWMESH_RETENTION_SECRET_NAME }}
        run: ./scripts/run-production-acceptance.sh

      - name: Upload acceptance report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: flowmesh-production-acceptance
          path: ${{ runner.temp }}/flowmesh-production-acceptance.md
          if-no-files-found: warn
          retention-days: 30
