name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      # 检出仓库内容，供后续静态检查使用。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude=LICENSE \
            .; then
            exit 1
          fi

      # 防止本地凭据被误提交。示例文件允许保留占位符。
      - name: Reject committed local environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo 'Committed .env file detected. Commit only .env.example.' >&2
            exit 1
          fi

      # 在进入部署或备份操作前，先验证仓库内 Shell 脚本的语法。
      - name: Validate shell scripts
        run: bash -n scripts/*.sh

      # 使用非生产测试值校验 Chart 语法、合法凭据渲染和缺失凭据失败保护。
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Validate Helm chart
        env:
          HELM_TEST_JWT: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          HELM_TEST_REDIS_PASSWORD: ci-only-redis-password
          HELM_TEST_IAM_PASSWORD: ci-only-iam-password
          HELM_TEST_SUPPLIER_PASSWORD: ci-only-supplier-password
          HELM_TEST_WORKFLOW_PASSWORD: ci-only-workflow-password
        run: |
          helm lint infra/helm/flowmesh \
            --set-string global.jwtSigningKey="$HELM_TEST_JWT" \
            --set-string global.redisPassword="$HELM_TEST_REDIS_PASSWORD" \
            --set-string services.iam.dbPassword="$HELM_TEST_IAM_PASSWORD" \
            --set-string services.supplier.dbPassword="$HELM_TEST_SUPPLIER_PASSWORD" \
            --set-string services.workflow.dbPassword="$HELM_TEST_WORKFLOW_PASSWORD"
          helm template flowmesh infra/helm/flowmesh \
            --set-string global.jwtSigningKey="$HELM_TEST_JWT" \
            --set-string global.redisPassword="$HELM_TEST_REDIS_PASSWORD" \
            --set-string services.iam.dbPassword="$HELM_TEST_IAM_PASSWORD" \
            --set-string services.supplier.dbPassword="$HELM_TEST_SUPPLIER_PASSWORD" \
            --set-string services.workflow.dbPassword="$HELM_TEST_WORKFLOW_PASSWORD" >/dev/null
          if helm template flowmesh infra/helm/flowmesh >/dev/null 2>&1; then
            echo 'Chart must fail to render when runtime credentials are missing.' >&2
            exit 1
          fi

      # 使用项目固定的 Java 21 和 Maven Wrapper 执行完整 Reactor 测试。
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw test

      # 验证 Electron 渲染进程、主进程和生产构建产物。
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Electron desktop client
        working-directory: frontend
        run: npm run build

  rocketmq-e2e:
    name: RocketMQ end-to-end
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      # 检出源码，供本机打包并连接真实 RocketMQ Broker。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 使用真实 RocketMQ Broker 验证跨服务申请审批主链路。
      - name: Run RocketMQ E2E
        run: timeout 15m ./tests/rocketmq-e2e.sh

  container-images:
    name: Build and publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: repository-check
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            dockerfile: services/iam-service/Dockerfile
          - service: gateway-service
            dockerfile: services/gateway-service/Dockerfile
          - service: supplier-service
            dockerfile: services/supplier-service/Dockerfile
          - service: workflow-service
            dockerfile: services/workflow-service/Dockerfile
    steps:
      # 检出源码，供 Docker 构建上下文和镜像标签生成使用。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=main,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
