name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      # 检出仓库内容，供后续静态检查使用。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude=LICENSE \
            .; then
            exit 1
          fi

      # 防止本地凭据被误提交。示例文件允许保留占位符。
      - name: Reject committed local environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo 'Committed .env file detected. Commit only .env.example.' >&2
            exit 1
          fi

      # 使用项目固定的 Java 21 和 Maven Wrapper 执行完整 Reactor 测试。
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw test

      # 后端模块创建后，在此工作流中加入 Maven Enforcer、格式、测试和依赖安全检查。
