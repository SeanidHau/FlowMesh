name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-check:
    name: Repository checks
    runs-on: ubuntu-latest
    steps:
      # 检出仓库内容，供后续静态检查使用。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reject unresolved conflict markers
        run: |
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' \
            --exclude-dir=.git \
            --exclude=LICENSE \
            .; then
            exit 1
          fi

      # 防止本地凭据被误提交。示例文件允许保留占位符。
      - name: Reject committed local environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo 'Committed .env file detected. Commit only .env.example.' >&2
            exit 1
          fi

      # 在进入部署或备份操作前，先验证仓库内 Shell 脚本的语法。
      - name: Validate shell scripts
        run: bash -n scripts/*.sh infra/backup/entrypoint.sh tests/fault-drills/*.sh tests/kubernetes-production-smoke.sh tests/postgres-backup-e2e.sh tests/postgres-backup-upload-contract.sh tests/rocketmq-e2e.sh

      - name: Validate observability configuration
        run: bash scripts/validate-observability.sh

      - name: Validate image admission policy
        run: bash scripts/validate-supply-chain-policy.sh

      - name: Validate production deployment guardrails
        run: bash scripts/validate-production-config.sh infra/helm/flowmesh/values-production.yaml

      # 使用非生产测试值校验 Chart 语法、合法凭据渲染和缺失凭据失败保护。
      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Validate Helm chart
        env:
          HELM_TEST_JWT: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          HELM_TEST_REDIS_PASSWORD: ci-only-redis-password
          HELM_TEST_IAM_PASSWORD: ci-only-iam-password
          HELM_TEST_SUPPLIER_PASSWORD: ci-only-supplier-password
          HELM_TEST_WORKFLOW_PASSWORD: ci-only-workflow-password
          HELM_TEST_RISK_PASSWORD: ci-only-risk-password
          HELM_TEST_AUDIT_PASSWORD: ci-only-audit-password
          HELM_TEST_OBJECT_STORAGE_SECRET: ci-only-object-storage-secret
        run: |
          backup_test_args=(
            --set backup.postgres.host=postgres.ci.internal
            --set backup.s3.uri=s3://flowmesh-ci-backups
            --set backup.credentialsSecret=flowmesh-backup-credentials
          )
          helm lint infra/helm/flowmesh \
            --set-string global.jwtSigningKey="$HELM_TEST_JWT" \
            --set-string global.redisPassword="$HELM_TEST_REDIS_PASSWORD" \
            --set-string services.iam.dbPassword="$HELM_TEST_IAM_PASSWORD" \
            --set-string services.supplier.dbPassword="$HELM_TEST_SUPPLIER_PASSWORD" \
            --set-string services.workflow.dbPassword="$HELM_TEST_WORKFLOW_PASSWORD" \
            --set-string services.risk.dbPassword="$HELM_TEST_RISK_PASSWORD" \
            --set-string services.notificationAudit.dbPassword="$HELM_TEST_AUDIT_PASSWORD" \
            --set-string objectStorage.secretKey="$HELM_TEST_OBJECT_STORAGE_SECRET"
          helm template flowmesh infra/helm/flowmesh \
            --set-string global.jwtSigningKey="$HELM_TEST_JWT" \
            --set-string global.redisPassword="$HELM_TEST_REDIS_PASSWORD" \
            --set-string services.iam.dbPassword="$HELM_TEST_IAM_PASSWORD" \
            --set-string services.supplier.dbPassword="$HELM_TEST_SUPPLIER_PASSWORD" \
            --set-string services.workflow.dbPassword="$HELM_TEST_WORKFLOW_PASSWORD" \
            --set-string services.risk.dbPassword="$HELM_TEST_RISK_PASSWORD" \
            --set-string services.notificationAudit.dbPassword="$HELM_TEST_AUDIT_PASSWORD" \
            --set-string objectStorage.secretKey="$HELM_TEST_OBJECT_STORAGE_SECRET" >/dev/null
          if helm template flowmesh infra/helm/flowmesh >/dev/null 2>&1; then
            echo 'Chart must fail to render when runtime credentials are missing.' >&2
            exit 1
          fi
          helm lint infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}"
          helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" >/dev/null
          if ! helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" \
            --set observability.serviceMonitor.enabled=true \
            --set observability.serviceMonitor.labels.release=kube-prometheus-stack | grep -q '^kind: ServiceMonitor$'; then
            echo 'ServiceMonitor must render when explicitly enabled.' >&2
            exit 1
          fi
          if ! helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" \
            --set observability.prometheusRule.enabled=true \
            --set observability.prometheusRule.labels.release=kube-prometheus-stack | grep -q '^kind: PrometheusRule$'; then
            echo 'PrometheusRule must render when explicitly enabled.' >&2
            exit 1
          fi
          if ! helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" | grep -q 'kubernetes.io/metadata.name: "monitoring"'; then
            echo 'NetworkPolicy must allow Prometheus monitoring namespace ingress.' >&2
            exit 1
          fi
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" >/dev/null 2>&1; then
            echo 'Production chart must fail when immutable image tag is missing.' >&2
            exit 1
          fi
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" >/dev/null 2>&1; then
            echo 'Production chart must fail when ingress host or TLS is missing.' >&2
            exit 1
          fi
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" >/dev/null 2>&1; then
            echo 'Production chart must fail when external egress CIDRs are missing.' >&2
            exit 1
          fi
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" \
            --set observability.tracing.enabled=true \
            --set observability.tracing.exportEnabled=true >/dev/null 2>&1; then
            echo 'Production chart must fail when OTLP export is enabled without a Collector endpoint.' >&2
            exit 1
          fi
          helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            "${backup_test_args[@]}" \
            --set observability.tracing.enabled=true \
            --set observability.tracing.exportEnabled=true \
            --set observability.tracing.endpoint=http://otel-collector.observability:4318/v1/traces >/dev/null
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets \
            --set backup.s3.serverSideEncryption=plaintext \
            "${backup_test_args[@]}" >/dev/null 2>&1; then
            echo 'Production chart must reject unsupported backup encryption.' >&2
            exit 1
          fi
          if helm template flowmesh infra/helm/flowmesh \
            -f infra/helm/flowmesh/values-production.yaml \
            --set-string global.imageTag="production-ci-sha" \
            --set ingress.host=api.ci.flowmesh.example.com \
            --set 'ingress.tls[0].secretName=flowmesh-ci-tls' \
            --set 'ingress.tls[0].hosts[0]=api.ci.flowmesh.example.com' \
            --set 'networkPolicy.egress.externalCidrs[0]=10.0.0.0/8' \
            --set global.existingSecret=flowmesh-runtime-secrets >/dev/null 2>&1; then
            echo 'Production chart must require explicit backup destination settings.' >&2
            exit 1
          fi

      # 使用项目固定的 Java 21 和 Maven Wrapper 执行完整 Reactor 测试。
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven tests
        run: ./mvnw test

      # 使用临时 PostgreSQL 容器验证备份归档不会泄露角色密码，且可以恢复到独立数据库。
      - name: Run PostgreSQL backup recovery test
        run: ./tests/postgres-backup-e2e.sh

      # 不依赖云账号，验证备份上传参数、服务端加密和失败清理逻辑。
      - name: Run PostgreSQL backup upload contract test
        run: ./tests/postgres-backup-upload-contract.sh

      # 验证 Electron 渲染进程、主进程和生产构建产物。
      - name: Set up Node.js 26
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # 使用官方审计接口检查前端生产依赖和构建依赖，避免镜像源不支持 audit API 导致误报。
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --registry=https://registry.npmjs.org --audit-level=high

      - name: Build Electron desktop client
        working-directory: frontend
        run: npm run build

      - name: Run Electron security tests
        working-directory: frontend
        run: npm run test:electron

  rocketmq-e2e:
    name: RocketMQ end-to-end
    runs-on: ubuntu-latest
    needs: repository-check
    steps:
      # 检出源码，供本机打包并连接真实 RocketMQ Broker。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 使用真实 RocketMQ Broker 验证跨服务申请审批主链路。
      - name: Run RocketMQ E2E
        run: timeout 15m ./tests/rocketmq-e2e.sh

  container-images:
    name: Build and publish ${{ matrix.service }} image
    runs-on: ubuntu-latest
    needs: repository-check
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: iam-service
            dockerfile: services/iam-service/Dockerfile
          - service: gateway-service
            dockerfile: services/gateway-service/Dockerfile
          - service: supplier-service
            dockerfile: services/supplier-service/Dockerfile
          - service: workflow-service
            dockerfile: services/workflow-service/Dockerfile
          - service: risk-service
            dockerfile: services/risk-service/Dockerfile
          - service: notification-audit-service
            dockerfile: services/notification-audit-service/Dockerfile
          - service: postgres-backup
            dockerfile: infra/backup/Dockerfile
    steps:
      # 检出源码，供 Docker 构建上下文和镜像标签生成使用。
      - name: Check out source
        uses: actions/checkout@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/seanidhau/flowmesh/${{ matrix.service }}
          tags: |
            type=sha
            type=raw,value=${{ github.sha }},enable={{is_default_branch}}
            type=raw,value=main,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # 主分支发布后立即扫描不可变提交标签；只有通过扫描的镜像才会进入签名步骤。
      - name: Scan published image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/seanidhau/flowmesh/${{ matrix.service }}:${{ github.sha }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}

      # 使用 GitHub OIDC 进行无密钥签名，部署系统可按仓库和工作流身份校验镜像来源。
      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/seanidhau/flowmesh/${{ matrix.service }}:${{ github.sha }}
        run: cosign sign --yes "${IMAGE}"
