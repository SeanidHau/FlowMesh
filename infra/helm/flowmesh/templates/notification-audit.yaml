apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-notification-audit
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-audit
spec:
  replicas: {{ .Values.services.notificationAudit.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: notification-audit
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: notification-audit
    spec:
      {{- include "flowmesh.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.services.notificationAudit.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: notification-audit
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: notification-audit
          image: "{{ include "flowmesh.imageReference" (dict "root" . "service" .Values.services.notificationAudit) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.services.notificationAudit.port }}
          env:
            {{- include "flowmesh.observabilityEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqCommonEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqConsumerEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              value: {{ include "flowmesh.postgresqlJdbcUrl" (dict "root" . "schema" "audit") | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: AUDIT_DB_USER
              value: {{ .Values.services.notificationAudit.dbUser | quote }}
            - name: AUDIT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: AUDIT_DB_PASSWORD
            - name: JWT_ISSUER
              value: {{ .Values.global.jwtIssuer | quote }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: JWT_SIGNING_KEY
            - name: ROCKETMQ_NAMESRV_ADDR
              value: {{ .Values.rocketmq.namesrvAddr | quote }}
            - name: FLOWMESH_AUDIT_CONSUMER_ENABLED
              value: "true"
            - name: FLOWMESH_NOTIFICATION_DELIVERY_ENABLED
              value: {{ .Values.services.notificationAudit.notificationDelivery.enabled | quote }}
            {{- if .Values.services.notificationAudit.notificationDelivery.enabled }}
            - name: FLOWMESH_NOTIFICATION_WEBHOOK_URL
              value: {{ required "services.notificationAudit.notificationDelivery.webhookUrl is required when external notification delivery is enabled" .Values.services.notificationAudit.notificationDelivery.webhookUrl | quote }}
            - name: FLOWMESH_NOTIFICATION_SIGNING_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: {{ .Values.services.notificationAudit.notificationDelivery.signingSecretKey | quote }}
            {{- end }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.services.notificationAudit.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "flowmesh.postgresqlCaVolumeMount" (dict "secretName" .Values.postgresql.caSecretName "secretKey" .Values.postgresql.caSecretKey) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "flowmesh.postgresqlCaVolume" (dict "secretName" .Values.postgresql.caSecretName "secretKey" .Values.postgresql.caSecretKey) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-notification-audit
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-audit
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: notification-audit
  ports:
    - name: http
      port: {{ .Values.services.notificationAudit.port }}
      targetPort: http
