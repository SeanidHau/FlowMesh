{{- if .Values.observability.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "flowmesh.fullname" . }}
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    {{- with .Values.observability.prometheusRule.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: flowmesh-availability
      rules:
        - alert: FlowMeshServiceDown
          expr: 'up{job=~"gateway|iam|supplier|workflow|risk|notification-audit"} == 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh 服务不可用
            description: '{{ "{{ $labels.job }}" }} 已连续两分钟无法抓取。'
        - alert: FlowMeshHttp5xxRate
          expr: 'sum(rate(http_server_requests_seconds_count{job=~"gateway|iam|supplier|workflow|risk|notification-audit",status=~"5.."}[5m])) > 0.1'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh HTTP 5xx 增加
            description: FlowMesh 最近五分钟的 HTTP 5xx 速率超过 0.1 req/s。
        - alert: FlowMeshGatewayRateLimitRedisErrors
          expr: 'sum by (route) (rate(flowmesh_gateway_rate_limit_requests_total{outcome="redis_error"}[5m])) > 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh Gateway 限流 Redis 不可用
            description: 'Gateway 路由 {{ "{{ $labels.route }}" }} 的 Redis 限流连续两分钟执行失败。'
        - alert: FlowMeshGatewayRateLimitDenied
          expr: 'sum by (route) (rate(flowmesh_gateway_rate_limit_requests_total{outcome="denied"}[5m])) > 10'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh Gateway 限流拒绝量升高
            description: 'Gateway 路由 {{ "{{ $labels.route }}" }} 最近五分钟限流拒绝速率超过 10 req/s。'

    - name: flowmesh-messaging
      rules:
        - alert: FlowMeshOutboxBacklog
          expr: 'flowmesh_outbox_pending > 100'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh Outbox 持续积压
            description: '{{ "{{ $labels.instance }}" }} 的 Outbox 待投递数量超过 100。'
        - alert: FlowMeshDeadLetterEvents
          expr: 'flowmesh_outbox_dead_lettered_current > 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh 出现死信事件
            description: '{{ "{{ $labels.instance }}" }} 存在待处置死信事件。'
        - alert: FlowMeshConsumerFailures
          expr: 'sum by (consumer) (rate(flowmesh_messaging_failed_total[5m])) > 0'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh 消费者持续失败
            description: '消费者 {{ "{{ $labels.consumer }}" }} 在过去五分钟持续失败。'
        - alert: FlowMeshConsumerProcessingLatency
          expr: 'histogram_quantile(0.95, sum by (consumer, le) (rate(flowmesh_messaging_processing_seconds_bucket[5m]))) > 5'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh 消费处理延迟升高
            description: '消费者 {{ "{{ $labels.consumer }}" }} 的消息处理 P95 已连续五分钟超过 5 秒。'
        - alert: FlowMeshOutboxConfirmationFailures
          expr: 'sum by (service) (rate(flowmesh_outbox_confirmation_failed_total[5m])) > 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh Outbox 确认失败
            description: '服务 {{ "{{ $labels.service }}" }} 已发送消息但未完成本地确认。'
        - alert: FlowMeshNotificationDeliveryBacklog
          expr: 'flowmesh_notification_delivery_pending > 100'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh 外部通知持续积压
            description: '{{ "{{ $labels.instance }}" }} 的外部通知待投递数量超过 100。'
        - alert: FlowMeshNotificationDeliveryDeadLetter
          expr: 'flowmesh_notification_delivery_dead_lettered_current > 0'
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh 外部通知进入死信
            description: '{{ "{{ $labels.instance }}" }} 存在待处置的外部通知死信。'
        - alert: FlowMeshNotificationDeliveryFailures
          expr: 'sum(rate(flowmesh_notification_delivery_failed_total[5m])) > 0'
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh 外部通知持续失败
            description: 外部通知 Webhook 最近五分钟持续投递失败。

    # 作用：将服务级可用性和延迟目标转换为可查询的 recording rule，供告警和看板复用。
    - name: flowmesh-slo
      rules:
        - record: flowmesh:slo:http_requests_total:rate5m
          expr: 'sum(rate(http_server_requests_seconds_count{job=~"gateway|iam|supplier|workflow|risk|notification-audit"}[5m]))'
        - record: flowmesh:slo:http_requests_5xx:rate5m
          expr: 'sum(rate(http_server_requests_seconds_count{job=~"gateway|iam|supplier|workflow|risk|notification-audit",status=~"5.."}[5m]))'
        - record: flowmesh:slo:http_availability_ratio:5m
          expr: '1 - (flowmesh:slo:http_requests_5xx:rate5m / flowmesh:slo:http_requests_total:rate5m)'
        - record: flowmesh:slo:http_latency_p95_seconds:5m
          expr: 'histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{job=~"gateway|iam|supplier|workflow|risk|notification-audit"}[5m])))'
        - alert: FlowMeshHttpAvailabilitySloViolation
          expr: 'flowmesh:slo:http_availability_ratio:5m < 0.999'
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh HTTP 可用性低于 SLO
            description: 最近五分钟 HTTP 可用性低于 99.9%，已持续十分钟。
        - alert: FlowMeshHttpLatencySloViolation
          expr: 'flowmesh:slo:http_latency_p95_seconds:5m > 1'
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh HTTP 延迟超过 SLO
            description: 最近五分钟 HTTP P95 延迟超过 1 秒，已持续十分钟。

    # 这些规则依赖 kube-state-metrics 提供的 CronJob 状态指标；没有该组件时应在目标平台补齐，
    # 否则 Prometheus 无法判断维护任务是否长期没有成功执行。
    - name: flowmesh-scheduled-jobs
      rules:
        - alert: FlowMeshWorkflowSlaCronJobStale
          expr: '(time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "flowmesh.fullname" . }}-workflow-sla"}) > 900'
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh Workflow SLA 任务未按时成功
            description: Workflow SLA CronJob 已超过 15 分钟没有成功执行，审批超时催办和升级可能停止。
        - alert: FlowMeshPostgresBackupCronJobStale
          expr: '(time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "flowmesh.fullname" . }}-postgres-backup"}) > 93600'
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: FlowMesh PostgreSQL 备份任务未按时成功
            description: PostgreSQL 备份 CronJob 已超过 26 小时没有成功执行，请立即检查备份归档和对象存储上传。
        - alert: FlowMeshPostgresRetentionCronJobStale
          expr: '(time() - kube_cronjob_status_last_successful_time{namespace="{{ .Release.Namespace }}", cronjob="{{ include "flowmesh.fullname" . }}-postgres-retention"}) > 93600'
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: FlowMesh 生命周期清理任务未按时成功
            description: PostgreSQL 生命周期清理 CronJob 已超过 26 小时没有成功执行，消息和幂等数据可能持续增长。
{{- end }}
