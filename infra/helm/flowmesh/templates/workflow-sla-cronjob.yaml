{{- if .Values.workflowSla.enabled }}
{{- if and .Values.global.production (not .Values.global.existingSecret) (not .Values.workflowSla.dbPassword) }}
{{- fail "workflowSla.dbPassword is required when SLA CronJob is enabled in production mode" }}
{{- end }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "flowmesh.fullname" . }}-workflow-sla
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: workflow-sla
spec:
  schedule: {{ .Values.workflowSla.schedule | quote }}
  timeZone: {{ .Values.workflowSla.timeZone | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: workflow-sla
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: workflow-sla
              image: "{{ .Values.workflowSla.image }}:{{ .Values.workflowSla.tag }}"
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              env:
                - name: PGHOST
                  value: {{ .Values.postgresql.host | quote }}
                - name: PGPORT
                  value: {{ .Values.postgresql.port | quote }}
                - name: PGDATABASE
                  value: {{ .Values.postgresql.database | quote }}
                - name: PGUSER
                  value: {{ .Values.workflowSla.dbUser | quote }}
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ include "flowmesh.configSecret" . }}
                      key: WORKFLOW_SLA_DB_PASSWORD
                - name: PGSSLMODE
                  value: {{ .Values.postgresql.sslMode | quote }}
              command: ["/bin/bash", "-ec"]
              args:
                - |
                  psql --set ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
                  BEGIN;
                  WITH due AS (
                    SELECT t.id, t.tenant_id, t.application_id, t.task_key, t.due_at,
                           i.applicant_user_id, gen_random_uuid() AS event_id
                    FROM workflow.workflow_tasks t
                    JOIN workflow.workflow_instances i ON i.id = t.workflow_instance_id
                    WHERE t.status = 'PENDING' AND t.reminder_at <= CURRENT_TIMESTAMP
                      AND t.reminded_at IS NULL
                    ORDER BY t.reminder_at LIMIT 100 FOR UPDATE OF t SKIP LOCKED
                  ), marked AS (
                    UPDATE workflow.workflow_tasks t SET reminded_at = CURRENT_TIMESTAMP
                    FROM due WHERE t.id = due.id RETURNING due.*
                  )
                  INSERT INTO workflow.workflow_outbox_events
                    (id, tenant_id, aggregate_id, topic, tag, payload, created_at)
                  SELECT event_id, tenant_id, application_id, 'workflow-events',
                    'WorkflowTaskSlaReminderRequested',
                    jsonb_build_object('eventId', event_id, 'eventType', 'WorkflowTaskSlaReminderRequested',
                      'schemaVersion', 1, 'tenantId', tenant_id, 'aggregateId', application_id,
                      'occurredAt', CURRENT_TIMESTAMP, 'traceId', 'workflow-sla-cronjob',
                      'payload', jsonb_build_object('applicantUserId', applicant_user_id,
                        'taskKey', task_key, 'dueAt', due_at)), CURRENT_TIMESTAMP
                  FROM marked;
                  COMMIT;
                  SQL
                  psql --set ON_ERROR_STOP=1 --no-psqlrc <<'SQL'
                  BEGIN;
                  DO $$
                  DECLARE r RECORD; event_id UUID; escalation_id UUID;
                  BEGIN
                    FOR r IN
                      SELECT t.id, t.workflow_instance_id, t.tenant_id, t.application_id,
                             t.round_no, t.task_key, t.due_at, i.applicant_user_id,
                             i.version AS instance_version
                      FROM workflow.workflow_tasks t
                      JOIN workflow.workflow_instances i ON i.id = t.workflow_instance_id
                      WHERE t.status = 'PENDING' AND t.due_at <= CURRENT_TIMESTAMP
                        AND t.escalated_at IS NULL
                        AND t.task_key IN ('PURCHASER_REVIEW', 'LEGAL_REVIEW', 'FINANCE_REVIEW')
                      ORDER BY t.due_at LIMIT 100 FOR UPDATE OF t, i SKIP LOCKED
                    LOOP
                      UPDATE workflow.workflow_tasks SET status = 'ESCALATED', escalated_at = CURRENT_TIMESTAMP
                        WHERE id = r.id AND status = 'PENDING';
                      IF NOT FOUND THEN CONTINUE; END IF;
                      UPDATE workflow.workflow_tasks SET status = 'CANCELLED'
                        WHERE workflow_instance_id = r.workflow_instance_id AND round_no = r.round_no
                          AND status = 'PENDING';
                      UPDATE workflow.workflow_instances SET current_task = 'OPERATIONS_ESCALATION', version = version + 1
                        WHERE id = r.workflow_instance_id AND tenant_id = r.tenant_id
                          AND status = 'IN_PROGRESS' AND version = r.instance_version;
                      IF NOT FOUND THEN CONTINUE; END IF;
                      escalation_id := gen_random_uuid();
                      INSERT INTO workflow.workflow_tasks
                        (id, workflow_instance_id, tenant_id, application_id, task_key, round_no, status, created_at)
                        VALUES (escalation_id, r.workflow_instance_id, r.tenant_id, r.application_id,
                          'OPERATIONS_ESCALATION', r.round_no, 'PENDING', CURRENT_TIMESTAMP);
                      event_id := gen_random_uuid();
                      INSERT INTO workflow.workflow_outbox_events
                        (id, tenant_id, aggregate_id, topic, tag, payload, created_at)
                        VALUES (event_id, r.tenant_id, r.application_id, 'workflow-events',
                          'WorkflowTaskSlaEscalated',
                          jsonb_build_object('eventId', event_id, 'eventType', 'WorkflowTaskSlaEscalated',
                            'schemaVersion', 1, 'tenantId', r.tenant_id, 'aggregateId', r.application_id,
                            'occurredAt', CURRENT_TIMESTAMP, 'traceId', 'workflow-sla-cronjob',
                            'payload', jsonb_build_object('applicantUserId', r.applicant_user_id,
                              'taskKey', r.task_key, 'dueAt', r.due_at,
                              'escalationTaskKey', 'OPERATIONS_ESCALATION')), CURRENT_TIMESTAMP);
                    END LOOP;
                  END $$;
                  COMMIT;
                  SQL
              resources:
                {{- toYaml .Values.workflowSla.resources | nindent 16 }}
{{- end }}
