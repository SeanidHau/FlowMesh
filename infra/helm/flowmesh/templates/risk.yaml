apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-risk
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: risk
spec:
  replicas: {{ .Values.services.risk.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: risk
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: risk
    spec:
      {{- include "flowmesh.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.services.risk.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: risk
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: risk
          image: "{{ include "flowmesh.imageReference" (dict "root" . "service" .Values.services.risk) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.services.risk.port }}
          env:
            {{- include "flowmesh.observabilityEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqCommonEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqProducerEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqConsumerEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}?currentSchema=risk&sslmode={{ .Values.postgresql.sslMode }}"
            - name: RISK_DB_USER
              value: {{ .Values.services.risk.dbUser | quote }}
            - name: RISK_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: RISK_DB_PASSWORD
            - name: ROCKETMQ_NAMESRV_ADDR
              value: {{ .Values.rocketmq.namesrvAddr | quote }}
            - name: FLOWMESH_RISK_FAULT_INJECTION_ENABLED
              value: "false"
            - name: FLOWMESH_RISK_CONSUMER_ENABLED
              value: "true"
            - name: FLOWMESH_RISK_OUTBOX_ENABLED
              value: "true"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.services.risk.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-risk
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: risk
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: risk
  ports:
    - name: http
      port: {{ .Values.services.risk.port }}
      targetPort: http
