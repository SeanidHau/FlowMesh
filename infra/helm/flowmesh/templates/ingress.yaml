{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "flowmesh.fullname" . }}
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          - path: /api/iam
            pathType: Prefix
            backend:
              service:
                name: {{ include "flowmesh.fullname" . }}-gateway
                port:
                  name: http
          - path: /api/supplier
            pathType: Prefix
            backend:
              service:
                name: {{ include "flowmesh.fullname" . }}-gateway
                port:
                  name: http
          - path: /api/workflow
            pathType: Prefix
            backend:
              service:
                name: {{ include "flowmesh.fullname" . }}-gateway
                port:
                  name: http
          - path: /api/notification
            pathType: Prefix
            backend:
              service:
                name: {{ include "flowmesh.fullname" . }}-gateway
                port:
                  name: http
{{- end }}
