apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-supplier
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplier
spec:
  replicas: {{ .Values.services.supplier.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: supplier
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: supplier
    spec:
      {{- include "flowmesh.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.services.supplier.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: {{ .Values.global.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: supplier
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supplier
          image: "{{ include "flowmesh.imageReference" (dict "root" . "service" .Values.services.supplier) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.services.supplier.port }}
          env:
            {{- include "flowmesh.observabilityEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqCommonEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqProducerEnv" . | nindent 12 }}
            {{- include "flowmesh.rocketmqConsumerEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              value: {{ include "flowmesh.postgresqlJdbcUrl" (dict "root" . "schema" "supplier") | quote }}
            - name: SPRING_FLYWAY_ENABLED
              value: "false"
            - name: SUPPLIER_DB_USER
              value: {{ .Values.services.supplier.dbUser | quote }}
            - name: SUPPLIER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: SUPPLIER_DB_PASSWORD
            - name: JWT_ISSUER
              value: {{ .Values.global.jwtIssuer | quote }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: JWT_SIGNING_KEY
            - name: ROCKETMQ_NAMESRV_ADDR
              value: {{ .Values.rocketmq.namesrvAddr | quote }}
            - name: FLOWMESH_OUTBOX_ENABLED
              value: "true"
            - name: FLOWMESH_SUPPLIER_CONSUMER_ENABLED
              value: "true"
            - name: FLOWMESH_WORKFLOW_BASE_URL
              value: "http://{{ include "flowmesh.fullname" . }}-workflow:{{ .Values.services.workflow.port }}"
            - name: FLOWMESH_OBJECT_STORAGE_ENDPOINT
              value: {{ .Values.objectStorage.endpoint | quote }}
            - name: FLOWMESH_OBJECT_STORAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: OBJECT_STORAGE_ACCESS_KEY
            - name: FLOWMESH_OBJECT_STORAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: OBJECT_STORAGE_SECRET_KEY
            - name: FLOWMESH_OBJECT_STORAGE_BUCKET
              value: {{ .Values.objectStorage.bucket | quote }}
            - name: FLOWMESH_OBJECT_STORAGE_AUTO_CREATE_BUCKET
              value: {{ .Values.objectStorage.autoCreateBucket | quote }}
            - name: FLOWMESH_OBJECT_STORAGE_READINESS_ENABLED
              value: "true"
            - name: FLOWMESH_FILE_SCAN_ENABLED
              value: {{ .Values.fileScan.enabled | quote }}
            - name: FLOWMESH_CLAMAV_HOST
              value: {{ .Values.fileScan.host | quote }}
            - name: FLOWMESH_CLAMAV_PORT
              value: {{ .Values.fileScan.port | quote }}
            - name: FLOWMESH_CLAMAV_TIMEOUT
              value: {{ .Values.fileScan.timeout | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.services.supplier.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- include "flowmesh.postgresqlCaVolumeMount" (dict "secretName" .Values.postgresql.caSecretName "secretKey" .Values.postgresql.caSecretKey) | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "flowmesh.postgresqlCaVolume" (dict "secretName" .Values.postgresql.caSecretName "secretKey" .Values.postgresql.caSecretKey) | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-supplier
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplier
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: supplier
  ports:
    - name: http
      port: {{ .Values.services.supplier.port }}
      targetPort: http
