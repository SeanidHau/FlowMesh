apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-supplier
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplier
spec:
  replicas: {{ .Values.services.supplier.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: supplier
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: supplier
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: supplier
          image: "{{ .Values.services.supplier.image }}:{{ .Values.services.supplier.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.services.supplier.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}?currentSchema=supplier"
            - name: SUPPLIER_DB_USER
              value: {{ .Values.services.supplier.dbUser | quote }}
            - name: SUPPLIER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: SUPPLIER_DB_PASSWORD
            - name: JWT_ISSUER
              value: {{ .Values.global.jwtIssuer | quote }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: JWT_SIGNING_KEY
            - name: ROCKETMQ_NAMESRV_ADDR
              value: {{ .Values.rocketmq.namesrvAddr | quote }}
            - name: FLOWMESH_OUTBOX_ENABLED
              value: "true"
            - name: FLOWMESH_SUPPLIER_CONSUMER_ENABLED
              value: "true"
            - name: FLOWMESH_WORKFLOW_BASE_URL
              value: "http://{{ include "flowmesh.fullname" . }}-workflow:{{ .Values.services.workflow.port }}"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.services.supplier.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-supplier
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: supplier
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: supplier
  ports:
    - name: http
      port: {{ .Values.services.supplier.port }}
      targetPort: http
