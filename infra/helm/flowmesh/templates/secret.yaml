{{- if not .Values.global.existingSecret }}
{{- $jwt := required "global.jwtSigningKey is required when global.existingSecret is empty" .Values.global.jwtSigningKey -}}
{{- $redis := required "global.redisPassword is required when global.existingSecret is empty" .Values.global.redisPassword -}}
{{- $iam := required "services.iam.dbPassword is required when global.existingSecret is empty" .Values.services.iam.dbPassword -}}
{{- $supplier := required "services.supplier.dbPassword is required when global.existingSecret is empty" .Values.services.supplier.dbPassword -}}
{{- $workflow := required "services.workflow.dbPassword is required when global.existingSecret is empty" .Values.services.workflow.dbPassword -}}
{{- $workflowSla := default "" .Values.workflowSla.dbPassword -}}
{{- if and .Values.workflowSla.enabled (not $workflowSla) }}
{{- fail "workflowSla.dbPassword is required when SLA CronJob is enabled" }}
{{- end }}
{{- $risk := required "services.risk.dbPassword is required when global.existingSecret is empty" .Values.services.risk.dbPassword -}}
{{- $audit := required "services.notificationAudit.dbPassword is required when global.existingSecret is empty" .Values.services.notificationAudit.dbPassword -}}
{{- $notificationSigningSecret := default "" .Values.services.notificationAudit.notificationDelivery.signingSecret -}}
{{- if and .Values.services.notificationAudit.notificationDelivery.enabled (not $notificationSigningSecret) }}
{{- fail "services.notificationAudit.notificationDelivery.signingSecret is required when notification delivery is enabled and global.existingSecret is empty" }}
{{- end }}
{{- $objectAccess := required "objectStorage.accessKey is required when global.existingSecret is empty" .Values.objectStorage.accessKey -}}
{{- $objectSecret := required "objectStorage.secretKey is required when global.existingSecret is empty" .Values.objectStorage.secretKey -}}
{{- if or (eq $jwt "replace-with-base64-encoded-random-secret") (eq $redis "change-me-redis") (eq $iam "change-me-iam") (eq $supplier "change-me-supplier") (eq $workflow "change-me-workflow") (and .Values.workflowSla.enabled (eq $workflowSla "change-me-workflow-sla")) (eq $risk "change-me-risk") (eq $audit "change-me-audit") (eq $objectSecret "change-me-minio") -}}
{{- fail "known default credentials are not allowed; provide real Secret values" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowmesh.configSecret" . }}
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SIGNING_KEY: {{ $jwt | quote }}
  REDIS_PASSWORD: {{ $redis | quote }}
  IAM_DB_PASSWORD: {{ $iam | quote }}
  SUPPLIER_DB_PASSWORD: {{ $supplier | quote }}
  WORKFLOW_DB_PASSWORD: {{ $workflow | quote }}
  WORKFLOW_SLA_DB_PASSWORD: {{ $workflowSla | quote }}
  RISK_DB_PASSWORD: {{ $risk | quote }}
  AUDIT_DB_PASSWORD: {{ $audit | quote }}
{{- if .Values.services.notificationAudit.notificationDelivery.enabled }}
  NOTIFICATION_WEBHOOK_SIGNING_SECRET: {{ $notificationSigningSecret | quote }}
{{- end }}
  OBJECT_STORAGE_ACCESS_KEY: {{ $objectAccess | quote }}
  OBJECT_STORAGE_SECRET_KEY: {{ $objectSecret | quote }}
  ROCKETMQ_PRODUCER_ACCESS_KEY: {{ .Values.rocketmq.producer.accessKey | quote }}
  ROCKETMQ_PRODUCER_SECRET_KEY: {{ .Values.rocketmq.producer.secretKey | quote }}
  ROCKETMQ_CONSUMER_ACCESS_KEY: {{ .Values.rocketmq.consumer.accessKey | quote }}
  ROCKETMQ_CONSUMER_SECRET_KEY: {{ .Values.rocketmq.consumer.secretKey | quote }}
{{- end }}
