{{- if not .Values.global.existingSecret }}
{{- $jwt := required "global.jwtSigningKey is required when global.existingSecret is empty" .Values.global.jwtSigningKey -}}
{{- $iam := required "services.iam.dbPassword is required when global.existingSecret is empty" .Values.services.iam.dbPassword -}}
{{- $supplier := required "services.supplier.dbPassword is required when global.existingSecret is empty" .Values.services.supplier.dbPassword -}}
{{- $workflow := required "services.workflow.dbPassword is required when global.existingSecret is empty" .Values.services.workflow.dbPassword -}}
{{- if or (eq $jwt "replace-with-base64-encoded-random-secret") (eq $iam "change-me-iam") (eq $supplier "change-me-supplier") (eq $workflow "change-me-workflow") -}}
{{- fail "known default credentials are not allowed; provide real Secret values" -}}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "flowmesh.configSecret" . }}
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SIGNING_KEY: {{ $jwt | quote }}
  IAM_DB_PASSWORD: {{ $iam | quote }}
  SUPPLIER_DB_PASSWORD: {{ $supplier | quote }}
  WORKFLOW_DB_PASSWORD: {{ $workflow | quote }}
{{- end }}
