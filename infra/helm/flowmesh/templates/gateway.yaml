apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-gateway
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  replicas: {{ .Values.gateway.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.gateway.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: "{{ include "flowmesh.imageReference" (dict "root" . "service" .Values.gateway) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.port }}
          env:
            {{- include "flowmesh.observabilityEnv" . | nindent 12 }}
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: REDIS_PASSWORD
            - name: FLOWMESH_GATEWAY_RATE_LIMIT_REPLENISH_RATE
              value: {{ .Values.gateway.rateLimit.replenishRate | quote }}
            - name: FLOWMESH_GATEWAY_RATE_LIMIT_BURST_CAPACITY
              value: {{ .Values.gateway.rateLimit.burstCapacity | quote }}
            - name: FLOWMESH_GATEWAY_RATE_LIMIT_REQUESTED_TOKENS
              value: {{ .Values.gateway.rateLimit.requestedTokens | quote }}
            - name: FLOWMESH_GATEWAY_CLIENT_IP_HEADER
              value: {{ .Values.gateway.rateLimit.clientIpHeader | quote }}
            - name: FLOWMESH_IAM_URL
              value: "http://{{ include "flowmesh.fullname" . }}-iam:{{ .Values.services.iam.port }}"
            - name: FLOWMESH_SUPPLIER_URL
              value: "http://{{ include "flowmesh.fullname" . }}-supplier:{{ .Values.services.supplier.port }}"
            - name: FLOWMESH_WORKFLOW_URL
              value: "http://{{ include "flowmesh.fullname" . }}-workflow:{{ .Values.services.workflow.port }}"
            - name: FLOWMESH_NOTIFICATION_AUDIT_URL
              value: "http://{{ include "flowmesh.fullname" . }}-notification-audit:{{ .Values.services.notificationAudit.port }}"
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-gateway
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: gateway
  ports:
    - name: http
      port: {{ .Values.gateway.port }}
      targetPort: http
