{{- if and .Values.networkPolicy.enabled .Values.networkPolicy.egress.enabled }}
{{- if and .Values.global.production (not .Values.networkPolicy.egress.externalCidrs) }}
{{- fail "networkPolicy.egress.externalCidrs is required in production mode" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "flowmesh.fullname" . }}-egress
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes:
    - Egress
  egress:
    # 允许同一 FlowMesh Release 内的服务调用，例如 Gateway 到业务服务。
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
    # 允许解析外部依赖域名；目标集群需使用 kube-dns 标签约定。
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- range .Values.networkPolicy.egress.externalCidrs }}
    {{- if or (eq . "0.0.0.0/0") (eq . "::/0") }}
    {{- fail "networkPolicy.egress.externalCidrs must not allow an unrestricted default route" }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        {{- range $.Values.networkPolicy.egress.externalPorts }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
    {{- end }}
{{- end }}
