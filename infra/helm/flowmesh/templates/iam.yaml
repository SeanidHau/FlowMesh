apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "flowmesh.fullname" . }}-iam
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: iam
spec:
  replicas: {{ .Values.services.iam.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: iam
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: iam
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.services.iam.terminationGracePeriodSeconds }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
              app.kubernetes.io/component: iam
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: iam
          image: "{{ include "flowmesh.imageReference" (dict "root" . "service" .Values.services.iam) }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: {{ .Values.services.iam.port }}
          env:
            {{- include "flowmesh.observabilityEnv" . | nindent 12 }}
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://{{ .Values.postgresql.host }}:{{ .Values.postgresql.port }}/{{ .Values.postgresql.database }}?currentSchema=iam"
            - name: IAM_DB_USER
              value: {{ .Values.services.iam.dbUser | quote }}
            - name: IAM_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: IAM_DB_PASSWORD
            - name: JWT_ISSUER
              value: {{ .Values.global.jwtIssuer | quote }}
            - name: JWT_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: JWT_SIGNING_KEY
            - name: REDIS_HOST
              value: {{ .Values.redis.host | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.port | quote }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "flowmesh.configSecret" . }}
                  key: REDIS_PASSWORD
            - name: FLOWMESH_LOGIN_RATE_LIMIT_ENABLED
              value: {{ .Values.services.iam.loginRateLimitEnabled | quote }}
            - name: FLOWMESH_LOGIN_RATE_LIMIT_FAIL_OPEN
              value: {{ .Values.services.iam.loginRateLimitFailOpen | quote }}
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health, port: http }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          resources:
            {{- toYaml .Values.services.iam.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "flowmesh.fullname" . }}-iam
  labels:
    {{- include "flowmesh.labels" . | nindent 4 }}
    app.kubernetes.io/component: iam
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: iam
  ports:
    - name: http
      port: {{ .Values.services.iam.port }}
      targetPort: http
