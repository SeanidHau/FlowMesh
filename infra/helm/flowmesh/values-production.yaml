# 作用：生产环境覆盖值。凭据必须通过 external Secret 注入，不得写入本文件。
# PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 均指向外部高可用平台；本文件不部署这些依赖。
global:
  imagePullPolicy: IfNotPresent
  production: true
  # 服务 image 字段已包含 flowmesh 仓库命名空间，最终地址为
  # ghcr.io/seanidhau/flowmesh/<service>:<commit-sha>。
  imageRegistry: ghcr.io/seanidhau
  # 生产部署必须通过 --set-string global.imageTag=<Git commit SHA> 注入不可变镜像标签。
  imageTag: ""
  existingSecret: flowmesh-runtime-secrets

networkPolicy:
  enabled: true
  # 生产发布必须注入 PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 的实际出口 CIDR。
  egress:
    enabled: true
    externalCidrs: []

# 生产部署必须由发布流程注入真实域名和 TLS Secret；留空会让 Helm 渲染失败。
ingress:
  enabled: true
  className: nginx
  host: ""
  tls: []

objectStorage:
  endpoint: https://minio.internal.example.com
  bucket: flowmesh-documents

fileScan:
  enabled: true
  host: clamav.security.svc.cluster.local
  port: 3310
  timeout: 10s

gateway:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

services:
  iam:
    replicas: 2
    loginRateLimitFailOpen: false
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  supplier:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  workflow:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  risk:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  notificationAudit:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
