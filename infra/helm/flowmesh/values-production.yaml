# 作用：生产环境覆盖值。凭据必须通过 external Secret 注入，不得写入本文件。
# PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 均指向外部高可用平台；本文件不部署这些依赖。
global:
  imagePullPolicy: IfNotPresent
  production: true
  # 服务 image 字段已包含 flowmesh 仓库命名空间，最终地址为
  # ghcr.io/seanidhau/flowmesh/<service>:<commit-sha>。
  imageRegistry: ghcr.io/seanidhau
  # 生产部署必须通过 --set-string global.imageTag=<Git commit SHA> 注入不可变镜像标签。
  imageTag: ""
  existingSecret: flowmesh-runtime-secrets

networkPolicy:
  enabled: true
  # 生产 Gateway 只能由 Ingress Controller 进入，避免绕过 TLS、审计和入口限流。
  ingressNamespace: ingress-nginx
  # Prometheus Operator 通常在独立命名空间抓取 Actuator 指标。
  monitoringNamespace: monitoring
  # 生产发布必须注入 PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 的实际出口 CIDR。
  egress:
    enabled: true
    externalCidrs: []
    externalPorts: [443, 3310, 5432, 6379, 9876, 9000, 10909, 10911, 10912]

backup:
  # 生产环境必须提供外部 PostgreSQL 地址、对象存储 URI 和凭据 Secret。
  enabled: true
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  image: flowmesh/postgres-backup
  tag: ""
  imagePullPolicy: IfNotPresent
  serviceAccountName: ""
  credentialsSecret: flowmesh-backup-credentials
  postgres:
    host: ""
    port: 5432
    database: flowmesh
    user: flowmesh
    connectTimeoutSeconds: 5
  s3:
    uri: ""
    endpoint: ""
    region: us-east-1
    serverSideEncryption: AES256
    kmsKeyId: ""
  cleanupLocal: true
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

observability:
  # 未接入 Collector 时保持关闭；启用导出时必须通过 --set 注入真实 OTLP/HTTP 地址。
  tracing:
    enabled: false
    exportEnabled: false
    endpoint: ""
    samplingProbability: "0.1"
    connectTimeout: 2s
    exportTimeout: 5s
  prometheusRule:
    enabled: false
    labels: {}

# 生产部署必须由发布流程注入真实域名和 TLS Secret；留空会让 Helm 渲染失败。
ingress:
  enabled: true
  className: nginx
  host: ""
  tls: []

objectStorage:
  endpoint: https://minio.internal.example.com
  bucket: flowmesh-documents

fileScan:
  enabled: true
  host: clamav.security.svc.cluster.local
  port: 3310
  timeout: 10s

gateway:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  rateLimit:
    replenishRate: 100
    burstCapacity: 200
    requestedTokens: 1
    clientIpHeader: X-Real-IP

services:
  iam:
    replicas: 2
    loginRateLimitFailOpen: false
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  supplier:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  workflow:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  risk:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  notificationAudit:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
