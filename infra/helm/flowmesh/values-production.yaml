# 作用：生产环境覆盖值。凭据必须通过 external Secret 注入，不得写入本文件。
# PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 均指向外部高可用平台；本文件不部署这些依赖。
global:
  imagePullPolicy: IfNotPresent
  production: true
  # 服务 image 字段已包含 flowmesh 仓库命名空间，最终地址为
  # ghcr.io/seanidhau/flowmesh/<service>:<commit-sha>。
  imageRegistry: ghcr.io/seanidhau
  # 生产部署必须通过 --set-string global.imageTag=<Git commit SHA> 注入不可变镜像标签。
  imageTag: ""
  existingSecret: flowmesh-runtime-secrets

# 以下地址是生产平台占位值，发布流程必须通过 --set/额外 values 覆写为真实 HA 服务地址；
# 显式声明它们是为了阻止 Helm 继承本地 Compose 的 postgres/redis/rocketmq-namesrv 服务名。
postgresql:
  host: postgresql.internal.example.com
  port: 5432
  database: flowmesh
  sslMode: require

workflowSla:
  # 生产环境必须启用独立 SLA 维护任务；密码由 global.existingSecret 提供。
  enabled: true
  image: postgres
  # 固定 PostgreSQL 客户端镜像版本，避免 CronJob 使用可变的 major-only 标签。
  tag: "16.15"
  dbUser: flowmesh_workflow_sla
  dbPassword: ""

redis:
  host: redis.internal.example.com
  port: 6379
  sslEnabled: true

rocketmq:
  namesrvAddr: rocketmq-namesrv.internal.example.com:9876
  # CLOUD 适用于 RocketMQ 云端接入；自建集群可通过发布参数覆盖为 LOCAL。
  accessChannel: CLOUD
  producer:
    tlsEnabled: true
  consumer:
    tlsEnabled: true

networkPolicy:
  enabled: true
  # 生产 Gateway 只能由 Ingress Controller 进入，避免绕过 TLS、审计和入口限流。
  ingressNamespace: ingress-nginx
  # Prometheus Operator 通常在独立命名空间抓取 Actuator 指标。
  monitoringNamespace: monitoring
  # 生产发布必须注入 PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 的实际出口 CIDR。
  egress:
    enabled: true
    externalCidrs: []
    externalPorts: [443, 3310, 5432, 6379, 9876, 9000, 10909, 10911, 10912]

backup:
  # 生产环境必须提供外部 PostgreSQL 地址、对象存储 URI 和凭据 Secret。
  enabled: true
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  image: flowmesh/postgres-backup
  tag: ""
  imagePullPolicy: IfNotPresent
  serviceAccountName: ""
  credentialsSecret: flowmesh-backup-credentials
  postgres:
    host: ""
    port: 5432
    database: flowmesh
    user: flowmesh
    sslMode: require
    connectTimeoutSeconds: 5
  s3:
    uri: ""
    endpoint: ""
    region: us-east-1
    serverSideEncryption: AES256
    kmsKeyId: ""
    verifyRemote: true
  cleanupLocal: true
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

retention:
  # 生命周期任务使用单独的非超级用户维护账号，不复用备份账号。
  enabled: true
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  image: flowmesh/postgres-retention
  tag: ""
  imagePullPolicy: IfNotPresent
  credentialsSecret: flowmesh-retention-credentials
  dbUser: flowmesh_retention
  postgres:
    host: ""
    port: 5432
    database: flowmesh
    sslMode: require
    connectTimeoutSeconds: 5
  confirmation: "YES"
  outboxRetentionDays: 90
  dlqRetentionDays: 30
  inboxRetentionDays: 90
  batchSize: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

observability:
  # 未接入 Collector 时保持关闭；启用导出时必须通过 --set 注入真实 OTLP/HTTP 地址。
  tracing:
    enabled: false
    exportEnabled: false
    endpoint: ""
    samplingProbability: "0.1"
    connectTimeout: 2s
    exportTimeout: 5s
  prometheusRule:
    enabled: false
    labels: {}

# 生产部署必须由发布流程注入真实域名和 TLS Secret；留空会让 Helm 渲染失败。
ingress:
  enabled: true
  className: nginx
  host: ""
  tls: []

objectStorage:
  endpoint: https://minio.internal.example.com
  bucket: flowmesh-documents

fileScan:
  enabled: true
  host: clamav.security.svc.cluster.local
  port: 3310
  timeout: 10s

gateway:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  rateLimit:
    replenishRate: 100
    burstCapacity: 200
    requestedTokens: 1
    clientIpHeader: X-Real-IP

services:
  iam:
    replicas: 2
    loginRateLimitFailOpen: false
    refreshTokenCleanup:
      enabled: true
      intervalMs: 3600000
      initialDelayMs: 60000
      retention: P30D
      batchSize: 1000
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  supplier:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  workflow:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  risk:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  notificationAudit:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
