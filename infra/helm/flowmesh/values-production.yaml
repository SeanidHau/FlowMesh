# 作用：生产环境覆盖值。凭据必须通过 external Secret 注入，不得写入本文件。
global:
  imagePullPolicy: IfNotPresent
  existingSecret: flowmesh-runtime-secrets

services:
  iam:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  supplier:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  workflow:
    replicas: 2
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
