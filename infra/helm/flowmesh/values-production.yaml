# 作用：生产环境覆盖值。凭据必须通过 external Secret 注入，不得写入本文件。
# PostgreSQL、Redis、RocketMQ、MinIO 和 ClamAV 均指向外部高可用平台；本文件不部署这些依赖。
global:
  imagePullPolicy: IfNotPresent
  existingSecret: flowmesh-runtime-secrets

networkPolicy:
  enabled: true

objectStorage:
  endpoint: https://minio.internal.example.com
  bucket: flowmesh-documents

fileScan:
  enabled: true
  host: clamav.security.svc.cluster.local
  port: 3310
  timeout: 10s

gateway:
  replicas: 2
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  podDisruptionBudget:
    enabled: true
    minAvailable: 1

services:
  iam:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  supplier:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  workflow:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  risk:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
  notificationAudit:
    replicas: 2
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
