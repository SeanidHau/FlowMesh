# 作用：提供 Chart 的非敏感默认值。生产部署应使用预先创建的 Secret。
global:
  imagePullPolicy: IfNotPresent
  # 私有镜像仓库凭据由集群管理员预先创建；留空表示镜像仓库公开可读。
  imagePullSecrets: []
  production: false
  # 单节点本地环境允许副本共置；生产覆盖值改为 DoNotSchedule，强制副本跨节点分布。
  topologySpread:
    whenUnsatisfiable: ScheduleAnyway
  imageRegistry: ""
  imageTag: ""
  jwtIssuer: flowmesh-local
  jwtSigningKey: ""
  redisPassword: ""
  existingSecret: ""

postgresql:
  host: postgres
  port: 5432
  database: flowmesh
  sslMode: disable
  # 生产使用 verify-ca/verify-full 时，引用预先创建的 CA Secret；空值保持本地兼容。
  caSecretName: ""
  caSecretKey: ca.crt

migrations:
  # 生产发布通过 Helm pre-install/pre-upgrade Job 执行迁移，失败时阻止应用升级。
  backoffLimit: 2
  activeDeadlineSeconds: 600

workflowSla:
  # 生产环境启用独立 CronJob；本地默认关闭，避免不需要时消耗资源。
  enabled: false
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  image: postgres
  tag: "16"
  # 生产环境必须由发布流程注入 PostgreSQL 客户端镜像的不可变 digest。
  imageDigest: ""
  dbUser: flowmesh_workflow_sla
  dbPassword: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

rocketmq:
  namesrvAddr: rocketmq-namesrv:9876
  # 本地 Compose 不启用认证和 TLS；生产覆盖值必须开启 TLS 并使用外部 Secret 凭据。
  accessChannel: LOCAL
  producer:
    accessKey: ""
    secretKey: ""
    tlsEnabled: false
  consumer:
    accessKey: ""
    secretKey: ""
    tlsEnabled: false

redis:
  host: redis
  port: 6379
  # Redis ACL 用户名；单密码认证模式留空。
  username: ""
  sslEnabled: false

objectStorage:
  endpoint: http://minio:9000
  bucket: flowmesh-documents
  accessKey: flowmesh
  secretKey: ""

fileScan:
  enabled: false
  host: clamav
  port: 3310
  timeout: 10s

ingress:
  enabled: false
  className: nginx
  annotations: {}
  host: ""
  tls: []

networkPolicy:
  enabled: false
  # 生产环境只允许指定 Ingress Controller 命名空间访问 Gateway；留空表示不渲染 Gateway 入站策略。
  ingressNamespace: ""
  monitoringNamespace: monitoring
  egress:
    enabled: false
    externalCidrs: []
    externalPorts: [443, 3310, 5432, 6379, 9876, 9000, 10909, 10911, 10912]

backup:
  # 本地 Chart 默认不创建定时备份；生产覆盖值会强制配置备份目标。
  enabled: false
  schedule: "0 2 * * *"
  timeZone: "Etc/UTC"
  image: flowmesh/postgres-backup
  tag: 0.1.0
  imagePullPolicy: IfNotPresent
  serviceAccountName: ""
  credentialsSecret: ""
  postgres:
    host: ""
    port: 5432
    database: flowmesh
    user: flowmesh
    sslMode: disable
    caSecretName: ""
    caSecretKey: ca.crt
    connectTimeoutSeconds: 5
  s3:
    uri: ""
    endpoint: ""
    region: us-east-1
    serverSideEncryption: AES256
    kmsKeyId: ""
    # 生产环境建议开启，只有远端三个归档对象均可见后才写入 _SUCCESS 标记。
    verifyRemote: false
  cleanupLocal: true
  startingDeadlineSeconds: 900
  activeDeadlineSeconds: 3600
  backoffLimit: 2
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

retention:
  # 本地 Chart 默认不创建数据清理任务；生产覆盖值会启用专用维护账号。
  enabled: false
  schedule: "30 2 * * *"
  timeZone: "Etc/UTC"
  image: flowmesh/postgres-retention
  tag: 0.1.0
  imagePullPolicy: IfNotPresent
  credentialsSecret: ""
  dbUser: flowmesh_retention
  postgres:
    host: ""
    port: 5432
    database: flowmesh
    sslMode: disable
    caSecretName: ""
    caSecretKey: ca.crt
    connectTimeoutSeconds: 5
  confirmation: "YES"
  outboxRetentionDays: 90
  dlqRetentionDays: 30
  inboxRetentionDays: 90
  batchSize: 1000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

observability:
  tracing:
    enabled: false
    exportEnabled: false
    endpoint: http://localhost:4318/v1/traces
    samplingProbability: "0.1"
    connectTimeout: 2s
    exportTimeout: 5s
  serviceMonitor:
    enabled: false
    interval: 30s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

gateway:
  image: flowmesh/gateway-service
  tag: 0.1.0
  port: 8080
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  terminationGracePeriodSeconds: 30
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  rateLimit:
    replenishRate: 100
    burstCapacity: 200
    requestedTokens: 1
    clientIpHeader: X-Real-IP

services:
  iam:
    image: flowmesh/iam-service
    tag: 0.1.0
    port: 8081
    dbUser: flowmesh_iam
    dbPassword: ""
    dbMigratorUser: flowmesh_iam_migrator
    dbMigratorPassword: ""
    loginRateLimitEnabled: true
    loginRateLimitFailOpen: true
    refreshTokenCleanup:
      enabled: true
      intervalMs: 3600000
      initialDelayMs: 60000
      retention: P30D
      batchSize: 1000
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  supplier:
    image: flowmesh/supplier-service
    tag: 0.1.0
    port: 8082
    dbUser: flowmesh_supplier
    dbPassword: ""
    dbMigratorUser: flowmesh_supplier_migrator
    dbMigratorPassword: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  workflow:
    image: flowmesh/workflow-service
    tag: 0.1.0
    port: 8083
    dbUser: flowmesh_workflow
    dbPassword: ""
    dbMigratorUser: flowmesh_workflow_migrator
    dbMigratorPassword: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  risk:
    image: flowmesh/risk-service
    tag: 0.1.0
    port: 8084
    dbUser: flowmesh_risk
    dbPassword: ""
    dbMigratorUser: flowmesh_risk_migrator
    dbMigratorPassword: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
  notificationAudit:
    image: flowmesh/notification-audit-service
    tag: 0.1.0
    port: 8085
    dbUser: flowmesh_audit
    dbPassword: ""
    dbMigratorUser: flowmesh_audit_migrator
    dbMigratorPassword: ""
    notificationDelivery:
      enabled: false
      webhookUrl: ""
      signingSecret: ""
      signingSecretKey: NOTIFICATION_WEBHOOK_SIGNING_SECRET
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
