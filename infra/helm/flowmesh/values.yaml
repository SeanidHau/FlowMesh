# 作用：提供 Chart 的非敏感默认值。生产部署应使用预先创建的 Secret。
global:
  imagePullPolicy: IfNotPresent
  jwtIssuer: flowmesh-local
  jwtSigningKey: ""
  redisPassword: ""
  existingSecret: ""

postgresql:
  host: postgres
  port: 5432
  database: flowmesh

rocketmq:
  namesrvAddr: rocketmq-namesrv:9876

redis:
  host: redis
  port: 6379

services:
  iam:
    image: flowmesh/iam-service
    tag: 0.1.0
    port: 8081
    dbUser: flowmesh_iam
    dbPassword: ""
    loginRateLimitEnabled: true
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
  supplier:
    image: flowmesh/supplier-service
    tag: 0.1.0
    port: 8082
    dbUser: flowmesh_supplier
    dbPassword: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
  workflow:
    image: flowmesh/workflow-service
    tag: 0.1.0
    port: 8083
    dbUser: flowmesh_workflow
    dbPassword: ""
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 750m
        memory: 768Mi
    podDisruptionBudget:
      enabled: false
      minAvailable: 1
    terminationGracePeriodSeconds: 30
