apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-flowmesh-images
  annotations:
    policies.kyverno.io/title: Verify FlowMesh image signatures
    policies.kyverno.io/category: Software Supply Chain
    policies.kyverno.io/description: >-
      Only accept FlowMesh images signed by the protected main branch GitHub Actions workflow.
spec:
  validationFailureAction: Enforce
  background: false
  webhookConfiguration:
    timeoutSeconds: 30
  rules:
    - name: verify-flowmesh-images
      match:
        any:
          - resources:
              kinds:
                - Pod
      verifyImages:
        - imageReferences:
            - ghcr.io/seanidhau/flowmesh/*:*
          required: true
          mutateDigest: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    issuer: https://token.actions.githubusercontent.com
                    subject: https://github.com/SeanidHau/FlowMesh/.github/workflows/ci.yml@refs/heads/main
                    rekor:
                      url: https://rekor.sigstore.dev
