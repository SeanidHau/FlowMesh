services:
  postgres:
    image: postgres:16
    container_name: flowmesh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowmesh}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set in .env}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?SUPPLIER_DB_PASSWORD must be set in .env}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowmesh} -d ${POSTGRES_DB:-flowmesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    container_name: flowmesh-rocketmq-namesrv
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-volume-init:
    image: apache/rocketmq:5.3.2
    container_name: flowmesh-rocketmq-volume-init
    user: "0:0"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    command: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"]
    restart: "no"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    container_name: flowmesh-rocketmq-broker
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-volume-init:
        condition: service_completed_successfully
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
      - ./rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf

  iam-service:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    container_name: flowmesh-iam
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=iam
      IAM_DB_USER: flowmesh_iam
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      FLOWMESH_DEMO_DATA_ENABLED: ${FLOWMESH_DEMO_DATA_ENABLED:-true}
    ports:
      - "8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  supplier-service:
    build:
      context: ../..
      dockerfile: services/supplier-service/Dockerfile
    container_name: flowmesh-supplier
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=supplier
      SUPPLIER_DB_USER: flowmesh_supplier
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?SUPPLIER_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_OUTBOX_ENABLED: ${FLOWMESH_OUTBOX_ENABLED:-true}
      FLOWMESH_SUPPLIER_CONSUMER_ENABLED: ${FLOWMESH_SUPPLIER_CONSUMER_ENABLED:-true}
    ports:
      - "8082:8082"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  workflow-service:
    build:
      context: ../..
      dockerfile: services/workflow-service/Dockerfile
    container_name: flowmesh-workflow
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=workflow
      WORKFLOW_DB_USER: flowmesh_workflow
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_WORKFLOW_CONSUMER_ENABLED: ${FLOWMESH_WORKFLOW_CONSUMER_ENABLED:-true}
      FLOWMESH_WORKFLOW_OUTBOX_ENABLED: ${FLOWMESH_WORKFLOW_OUTBOX_ENABLED:-true}
    ports:
      - "8083:8083"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  rocketmq-store:
  rocketmq-logs:
