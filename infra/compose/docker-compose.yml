services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowmesh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowmesh}
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set in .env}
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?SUPPLIER_DB_PASSWORD must be set in .env}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD must be set in .env}
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?RISK_DB_PASSWORD must be set in .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD must be set in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flowmesh} -d ${POSTGRES_DB:-flowmesh}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowmesh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-flowmesh}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
      mc mb --ignore-existing local/flowmesh-documents
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.3
    profiles: [documents]
    ports:
      - "3310:3310"
    volumes:
      - clamavdata:/var/lib/clamav
    healthcheck:
      test: ["CMD-SHELL", "printf 'PING\\n' | nc -w 2 localhost 3310 | grep PONG"]
      interval: 30s
      timeout: 5s
      retries: 10

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.2
    ports:
      - "9876:9876"
    command: sh mqnamesrv

  rocketmq-volume-init:
    image: apache/rocketmq:5.3.2
    user: "0:0"
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
    command: ["sh", "-c", "chown -R 3000:3000 /home/rocketmq/store /home/rocketmq/logs"]
    restart: "no"

  rocketmq-broker:
    image: apache/rocketmq:5.3.2
    depends_on:
      rocketmq-namesrv:
        condition: service_started
      rocketmq-volume-init:
        condition: service_completed_successfully
    ports:
      - "10909:10909"
      - "10911:10911"
      - "10912:10912"
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
    volumes:
      - rocketmq-store:/home/rocketmq/store
      - rocketmq-logs:/home/rocketmq/logs
      - ${ROCKETMQ_BROKER_CONFIG:-./rocketmq/broker.conf}:/home/rocketmq/rocketmq-5.3.2/conf/broker.conf:ro
    command: sh mqbroker -c /home/rocketmq/rocketmq-5.3.2/conf/broker.conf

  iam-service:
    build:
      context: ../..
      dockerfile: services/iam-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=iam
      IAM_DB_USER: flowmesh_iam
      IAM_DB_PASSWORD: ${IAM_DB_PASSWORD:?IAM_DB_PASSWORD must be set in .env}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      FLOWMESH_DEMO_DATA_ENABLED: ${FLOWMESH_DEMO_DATA_ENABLED:-true}
      FLOWMESH_LOGIN_RATE_LIMIT_ENABLED: ${FLOWMESH_LOGIN_RATE_LIMIT_ENABLED:-true}
    ports:
      - "8081:8081"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  supplier-service:
    build:
      context: ../..
      dockerfile: services/supplier-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=supplier
      SUPPLIER_DB_USER: flowmesh_supplier
      SUPPLIER_DB_PASSWORD: ${SUPPLIER_DB_PASSWORD:?SUPPLIER_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_OUTBOX_ENABLED: ${FLOWMESH_OUTBOX_ENABLED:-true}
      FLOWMESH_SUPPLIER_CONSUMER_ENABLED: ${FLOWMESH_SUPPLIER_CONSUMER_ENABLED:-true}
      FLOWMESH_WORKFLOW_BASE_URL: http://workflow-service:8083
      FLOWMESH_OBJECT_STORAGE_ENDPOINT: http://minio:9000
      FLOWMESH_OBJECT_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-flowmesh}
      FLOWMESH_OBJECT_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env}
      FLOWMESH_OBJECT_STORAGE_BUCKET: flowmesh-documents
      FLOWMESH_OBJECT_STORAGE_READINESS_ENABLED: ${FLOWMESH_OBJECT_STORAGE_READINESS_ENABLED:-true}
      FLOWMESH_FILE_SCAN_ENABLED: ${FLOWMESH_FILE_SCAN_ENABLED:-false}
      FLOWMESH_CLAMAV_HOST: clamav
      FLOWMESH_CLAMAV_PORT: 3310
    ports:
      - "8082:8082"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8082/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  workflow-service:
    build:
      context: ../..
      dockerfile: services/workflow-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=workflow
      WORKFLOW_DB_USER: flowmesh_workflow
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:?WORKFLOW_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_WORKFLOW_CONSUMER_ENABLED: ${FLOWMESH_WORKFLOW_CONSUMER_ENABLED:-true}
      FLOWMESH_WORKFLOW_OUTBOX_ENABLED: ${FLOWMESH_WORKFLOW_OUTBOX_ENABLED:-true}
    ports:
      - "8083:8083"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8083/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  risk-service:
    build:
      context: ../..
      dockerfile: services/risk-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=risk
      RISK_DB_USER: flowmesh_risk
      RISK_DB_PASSWORD: ${RISK_DB_PASSWORD:?RISK_DB_PASSWORD must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_RISK_CONSUMER_ENABLED: ${FLOWMESH_RISK_CONSUMER_ENABLED:-true}
      FLOWMESH_RISK_OUTBOX_ENABLED: ${FLOWMESH_RISK_OUTBOX_ENABLED:-true}
    ports:
      - "8084:8084"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  notification-audit-service:
    build:
      context: ../..
      dockerfile: services/notification-audit-service/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      rocketmq-broker:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-flowmesh}?currentSchema=audit
      AUDIT_DB_USER: flowmesh_audit
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?AUDIT_DB_PASSWORD must be set in .env}
      JWT_ISSUER: ${JWT_ISSUER:-flowmesh-local}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY must be set in .env}
      ROCKETMQ_NAMESRV_ADDR: rocketmq-namesrv:9876
      FLOWMESH_AUDIT_CONSUMER_ENABLED: ${FLOWMESH_AUDIT_CONSUMER_ENABLED:-true}
    ports:
      - "8085:8085"
    read_only: true
    tmpfs:
      - /tmp
      - /home/flowmesh/logs:uid=10001,gid=10001,mode=1770
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  gateway-service:
    build:
      context: ../..
      dockerfile: services/gateway-service/Dockerfile
    depends_on:
      iam-service:
        condition: service_healthy
      supplier-service:
        condition: service_healthy
      workflow-service:
        condition: service_healthy
      notification-audit-service:
        condition: service_healthy
    environment:
      FLOWMESH_IAM_URL: http://iam-service:8081
      FLOWMESH_SUPPLIER_URL: http://supplier-service:8082
      FLOWMESH_WORKFLOW_URL: http://workflow-service:8083
      FLOWMESH_NOTIFICATION_AUDIT_URL: http://notification-audit-service:8085
    ports:
      - "8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-rules.yml:/etc/prometheus/rules/flowmesh.yml:ro
      - prometheusdata:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    depends_on:
      prometheus:
        condition: service_started
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana

volumes:
  pgdata:
  redisdata:
  miniodata:
  clamavdata:
  grafanadata:
  rocketmq-store:
  rocketmq-logs:
  prometheusdata:
